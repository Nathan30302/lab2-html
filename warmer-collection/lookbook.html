<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WARMER — Collection Lookbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0c0c0c;
      --paper: #f3f1ec;
      --mist: #e6e2da;
      --accent: #c81e1e;
      --mint: #7dffb2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, rgba(200, 30, 30, 0.08), transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(125, 255, 178, 0.08), transparent 45%),
        var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      padding: 3.5rem 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid rgba(12, 12, 12, 0.12);
    }
    .brand {
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(3.5rem, 12vw, 7rem);
      letter-spacing: 0.08em;
      line-height: 0.9;
    }
    .tag {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }
    .sub {
      margin: 1rem auto 0;
      max-width: 34rem;
      font-size: 1rem;
      line-height: 1.5;
      opacity: 0.75;
    }
    .hint {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      opacity: 0.6;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }
    h2 {
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.75rem;
      letter-spacing: 0.06em;
      margin: 2.5rem 0 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }
    figure {
      background: #fff;
      border: 1px solid rgba(12, 12, 12, 0.08);
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    figure:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(12, 12, 12, 0.08);
    }
    figure a { display: block; color: inherit; text-decoration: none; }
    figure img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: var(--mist);
    }
    figcaption {
      padding: 0.85rem 1rem 1rem;
    }
    .num {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.45;
    }
    .name {
      font-family: "Bebas Neue", sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      margin-top: 0.15rem;
    }
    .style {
      font-size: 0.8rem;
      opacity: 0.65;
      margin-top: 0.2rem;
    }
    footer {
      text-align: center;
      padding: 2rem 1rem 3rem;
      font-size: 0.8rem;
      opacity: 0.5;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">WARMER</div>
    <p class="tag">Strive for Progress</p>
    <p class="sub">Full collection lookbook — luxury, athletic, and street styles. Click any image to open full size, then save/download.</p>
    <p class="hint">29 product concepts · right‑click image → Save As…</p>
  </header>

  <main>
    <h2>Drop 01 — Expanded Styles</h2>
    <div class="grid" id="main-grid"></div>

    <h2>Core Colorways</h2>
    <div class="grid" id="core-grid"></div>
  </main>

  <footer>WARMER Collection · Concept Lookbook</footer>

  <script>
    const main = [
      ["01-warmer-satin-bomber.png", "Satin Bomber", "Luxury street · gold"],
      ["02-warmer-tracksuit-set.png", "Tracksuit Set", "Athletic / Trackstar"],
      ["03-warmer-slides.png", "Slides", "Everyday footwear"],
      ["04-warmer-crew-socks.png", "Crew Socks", "Essentials"],
      ["05-warmer-bucket-hat.png", "Bucket Hat", "Summer accessory"],
      ["06-warmer-luxury-zip-hoodie.png", "Luxury Zip Hoodie", "Quiet luxury"],
      ["07-warmer-pique-polo.png", "Pique Polo", "Smart casual"],
      ["08-warmer-football-jersey.png", "Football Jersey", "Sports street"],
      ["09-warmer-tech-joggers.png", "Tech Joggers", "Athleisure"],
      ["10-warmer-rib-beanie.png", "Rib Beanie", "Winter accessory"],
      ["11-warmer-windbreaker.png", "Windbreaker", "Colorblock sport"],
      ["12-warmer-puffer-vest.png", "Puffer Vest", "Layering"],
      ["13-warmer-canvas-tote.png", "Canvas Tote", "Lifestyle bag"],
      ["14-warmer-knee-socks.png", "Knee Socks", "Fashion socks"],
      ["15-warmer-trucker-cap.png", "Trucker Cap", "Classic street"],
      ["16-warmer-crop-hoodie.png", "Crop Hoodie", "Trend / unisex"],
      ["17-warmer-racing-jacket.png", "Racing Jacket", "Motorsport luxury"],
      ["18-warmer-fleece-shorts.png", "Fleece Shorts", "Summer staple"],
      ["19-warmer-silk-scarf.png", "Silk Scarf", "Fashion house"],
      ["20-warmer-quilted-jacket.png", "Quilted Jacket", "Outdoor chic"],
      ["21-warmer-denim-overshirt.png", "Denim Overshirt", "Workwear luxury"],
      ["22-warmer-longsleeve-tee.png", "Longsleeve Tee", "Core graphic"],
      ["23-warmer-house-slippers.png", "House Slippers", "Comfort lifestyle"]
    ];
    const core = [
      ["warmer-olive-tee.png", "Olive Tee", "KEEP MOVING"],
      ["warmer-cream-hoodie.png", "Cream Hoodie", "Core colorway"],
      ["warmer-black-tees-progress.png", "Black Neon Tee", "Set with hoodie"],
      ["warmer-navy-cap.png", "Navy Cap", "Accessory"],
      ["warmer-charcoal-crewneck.png", "Charcoal Crew", "Emblem chest"],
      ["warmer-sand-oversized-tee.png", "Sand Oversized", "BUILT DIFFERENT"]
    ];

    function render(list, targetId) {
      const el = document.getElementById(targetId);
      el.innerHTML = list.map(([file, name, style], i) => `
        <figure>
          <a href="${file}" target="_blank" download="${file}">
            <img src="${file}" alt="${name}" loading="lazy">
            <figcaption>
              <div class="num">${String(i + 1).padStart(2, "0")}</div>
              <div class="name">${name}</div>
              <div class="style">${style}</div>
            </figcaption>
          </a>
        </figure>
      `).join("");
    }
    render(main, "main-grid");
    render(core, "core-grid");
  </script>
</body>
</html>
